services:

  postgresql:
    image: postgres:16
    container_name: linktracker-postgres
    environment:
      POSTGRES_DB: scrapper
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  scrapper:
    build:
      context: .
      dockerfile: Scrapper/Dockerfile
    container_name: linktracker-scrapper
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgresql:5432/scrapper
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      BOT_API_URL: http://bot:8090
    depends_on:
      postgresql:
        condition: service_healthy

  bot:
    build:
      context: .
      dockerfile: Bot/Dockerfile
    container_name: linktracker-bot
    ports:
      - "8090:8090"
    environment:
      SCRAPPER_API_URL: http://scrapper:8080
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
    depends_on:
      - scrapper

volumes:
  postgres_data: